[package]
name = "vinyl"
version = "0.1.0"
edition = "2024"

[features]
default = ["gui"]
# Desktop window (`vinyl --gui`) built on GPUI. Leave it out
# (`cargo build --no-default-features`) for a terminal-only binary that
# compiles much faster.
gui = ["dep:gpui"]

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
gpui = { version = "0.2.2", optional = true }
# gpui pulls in xattr 0.2, which stopped compiling against libc 0.2.190+
# (ENOATTR was removed), so keep libc just below that until gpui updates.
libc = ">=0.2.182, <0.2.190"
lofty = "0.25.5"
ratatui = "0.30.2"
rodio = { version = "0.23.0", features = ["symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"
